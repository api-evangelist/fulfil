name: Fulfil
description: Fulfil (Fulfil Solutions) is an automation company that builds robotic online-grocery
  fulfillment systems. Its ShopBot robots perform zero-labor pick-and-pack across all grocery
  temperatures and categories (ambient, refrigerated, frozen, and produce), providing item-level
  data and control with claimed 99% order accuracy and roughly 50% lower operating costs. The
  company operates automated micro-fulfillment facilities and partners with grocery and delivery
  operators. Backed by DCVC, Fulfil was surfaced as a portfolio company and profiled in the API
  Evangelist network; it publishes a marketing website but no public developer, API, or
  documentation surface at this time.
